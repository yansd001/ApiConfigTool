[package]
name = "api-config-tool"
version = "1.0.0"
description = "Codex / Claude Code / Claude Desktop configuration"
edition = "2021"
rust-version = "1.85"

[lib]
name = "api_config_tool"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = { version = "0.22", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
fs2 = "0.4"
sha2 = "0.10"
jsonc-parser = { version = "0.32.1", features = ["cst"] }
url = "2"
rquickjs = "0.8"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
httpdate = "1"
portable-pty = "0.9"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
