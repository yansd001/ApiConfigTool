name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: v1.0

concurrency:
  group: release-v1.0
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run build
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force publish/licenses, release-assets | Out-Null
          Copy-Item src-tauri/target/release/api-config-tool.exe publish/ApiConfigTool.exe
          Copy-Item licenses/*.txt publish/licenses/
          Copy-Item README.md publish/README.md
          Copy-Item -Recurse docs publish/docs
          Compress-Archive -Path publish/* -DestinationPath "release-assets/ApiConfigTool-win-x64-$env:RELEASE_TAG.zip"
          Copy-Item publish/ApiConfigTool.exe release-assets/ApiConfigTool.exe
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p publish/licenses release-assets
          cp -R "src-tauri/target/$RELEASE_TARGET/release/bundle/macos/API Config Tool.app" publish/
          cp licenses/*.txt publish/licenses/
          cp README.md publish/
          cp -R docs publish/
          ditto -c -k --sequesterRsrc publish "release-assets/ApiConfigTool-$RELEASE_PLATFORM-$RELEASE_TAG.zip"
          images=(src-tauri/target/"$RELEASE_TARGET"/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          cp "${images[0]}" "release-assets/ApiConfigTool-$RELEASE_PLATFORM-$RELEASE_TAG.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Point v1.0 to the built commit
        uses: actions/github-script@v7
        with:
          script: |
            const ref = `tags/${process.env.RELEASE_TAG}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: context.sha });
              return;
            }
            await github.rest.git.updateRef({ ...context.repo, ref, sha: context.sha, force: true });
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.RELEASE_TAG }}
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Codex、Claude Code、Claude Desktop 配置与余额查询工具。

            固定发布版本 v1.0：每次构建成功后更新此 Release 和同名附件。
            构建提交：${{ github.sha }}

            Windows：下载 win-x64 ZIP，需要系统 WebView2 Runtime。
            macOS：Apple Silicon 下载 macos-arm64；Intel 下载 macos-x64。DMG 可拖动安装，ZIP 含应用与文档。
            macOS 构建暂未使用 Apple Developer ID 签名或公证。首次打开可能需要在“系统设置 → 隐私与安全性”允许打开。

            支持 API / 官方账号方式切换、默认 New API 余额查询，以及自定义余额脚本。
          files: |
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/*.exe
          generate_release_notes: false
      - name: Keep only application downloads in v1.0
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const asset of assets) {
              if (/\.(zip|dmg|exe)$/i.test(asset.name)) continue;
              await github.rest.repos.deleteReleaseAsset({
                ...context.repo,
                asset_id: asset.id,
              });
              core.info(`Removed obsolete release attachment: ${asset.name}`);
            }
